<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 136" width="860" height="136" role="img" aria-labelledby="t d">
<title id="t">Where the rules come from</title>
<desc id="d">Each rule starts from the built-in default (smc.Rules). An SMC_ value in .env replaces the default, and a value saved from the rule tuner replaces both: it has the highest priority.</desc>
<style>
  .bg { fill: #f8fafc; stroke: #cdd7e1; }
  .box { fill: #ffffff; stroke: #9fb0c2; stroke-width: 1.2; }
  .act { fill: #e2f1f5; stroke: #0b6e8a; stroke-width: 1.5; }
  .good { fill: #e3f4ea; stroke: #1a7f4b; stroke-width: 1.2; }
  .bad { fill: #fbe4e2; stroke: #b42318; stroke-width: 1.2; }
  .end { fill: #eef2f6; stroke: #9fb0c2; stroke-width: 1.2; stroke-dasharray: 4 3; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; fill: #0f1d2b; }
  .t { font-size: 15px; font-weight: 600; }
  .s { font-size: 12px; fill: #3a4a5a; }
  .lab { font-size: 12px; fill: #3a4a5a; }
  .k { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #6b7b8c; }
  .ln { stroke: #6b7b8c; stroke-width: 1.5; fill: none; }
  .arw { fill: #6b7b8c; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #13202e; stroke: #2a3a4b; }
    .box { fill: #0f1a26; stroke: #4a5f74; }
    .act { fill: #11313d; stroke: #3fb5d4; }
    .good { fill: #10301f; stroke: #4cc38a; }
    .bad { fill: #3a1714; stroke: #f0857a; }
    .end { fill: #16232f; stroke: #4a5f74; }
    text { fill: #e6edf3; }
    .s, .lab { fill: #b6c3cf; }
    .k { fill: #7d8e9e; }
    .ln { stroke: #7d8e9e; }
    .arw { fill: #7d8e9e; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arw" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="859" height="135" rx="10"/>
<rect class="box" x="20" y="34" width="230" height="60" rx="7"/>
<text class="t" x="135.0" y="60.5" text-anchor="middle">Built-in defaults</text>
<text class="s" x="135.0" y="78.5" text-anchor="middle">smc.Rules</text>
<path class="ln" d="M250 64 H306" marker-end="url(#a)"/>
<rect class="box" x="310" y="34" width="230" height="60" rx="7"/>
<text class="t" x="425.0" y="60.5" text-anchor="middle">SMC_* in .env</text>
<text class="s" x="425.0" y="78.5" text-anchor="middle">replaces a default</text>
<path class="ln" d="M540 64 H596" marker-end="url(#a)"/>
<rect class="act" x="600" y="34" width="240" height="60" rx="7"/>
<text class="t" x="720.0" y="60.5" text-anchor="middle">Saved from the rule tuner</text>
<text class="s" x="720.0" y="78.5" text-anchor="middle">replaces both</text>
<text class="k" x="135" y="118" text-anchor="middle">LOWEST PRIORITY</text>
<text class="k" x="720" y="118" text-anchor="middle">HIGHEST PRIORITY</text></svg>
