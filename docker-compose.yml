services:
  niftywhale:
    build: .
    image: niftywhale:latest
    container_name: niftywhale
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      TZ: "Asia/Kolkata"
      PORT: "5058"
      DB_PATH: /data/niftywhale.db
      UNIVERSE_PATH: /data/universe.json
      # The addresses NiftyWhale is served on (through Pi Observatory's Caddy). Passkeys are bound to the
      # first one's host name; sign-in cookies are accepted only from these pages.
      NIFTYWHALE_ORIGINS: "https://pandorasbox.local:5443,https://192.168.1.50:5443"
    volumes:
      - ./var:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # Loopback only: other devices come in over HTTPS on pandorasbox.local:5443 (Caddy, on this
    # compose network). Plain http from the network is closed; scripts on the Pi itself can still use
    # http://127.0.0.1:5058 with an API token.
    ports:
      - "127.0.0.1:5058:5058"

  # The lab: backtests, the autopilot and the weekly report (niftywhale/lab.py), in
  # its own process so heavy work never slows the live scanner. Same image and data.
  niftywhale-lab:
    image: niftywhale:latest
    container_name: niftywhale-lab
    restart: always
    command: ["python", "-m", "niftywhale.lab"]
    depends_on: [niftywhale]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: "Asia/Kolkata"
      DB_PATH: /data/niftywhale.db
      UNIVERSE_PATH: /data/universe.json
      NIFTYWHALE_SCHEDULER: "0"
      LAB_WORKERS: "3"
    volumes:
      - ./var:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # The live app always wins the CPU: a quarter of its share, and one core left free.
    cpu_shares: 256
    cpus: 3
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/data/lab/heartbeat') < 180 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  # The news desk's sentiment scorer (nlp/server.py): FinBERT on onnxruntime. No published
  # port: only the app reaches it, at http://niftywhale-nlp:8000. One core at most, low priority.
  niftywhale-nlp:
    build: ./nlp
    image: niftywhale-nlp:latest
    container_name: niftywhale-nlp
    restart: always
    environment:
      THREADS: "1"
    cpu_shares: 256
    cpus: 1
    mem_limit: 700m
